# monofonIC configuration for the GIZMO-PBHEF cosmo_test problem.
#
# A small uniform-resolution LCDM box with baryons, for exercising the PBHEF donor and receiver
# paths under both hydro solvers. It exists because the Santa Barbara cluster ICs cannot be run
# under MFV, and because a zoom with coarse dark matter in PartType1 makes the donor energy budget
# meaningless. Here every dark matter particle has gas in its kernel.
#
# Cosmology is Planck 2018 (TT,TE,EE+lowE+lensing+BAO), spelled out rather than taken from the
# built-in set so that the GIZMO parameter file can be checked against it line by line.
#
#   <path to>/monofonIC scripts/test_problems/outputs/cosmo_test/monofonic.conf

[setup]
GridRes         = 32        # 32^3 dark matter + 32^3 gas
BoxLength       = 25        # Mpc/h
zstart          = 99.0
LPTorder        = 3
DoBaryons       = yes
DoBaryonVrel    = yes       # relative baryon-CDM velocity to linear order
DoFixing        = no
DoInversion     = no
ParticleLoad    = sc

[cosmology]
ParameterSet    = none
Omega_m         = 0.3158
Omega_b         = 0.0494
Omega_L         = 0.6842
H0              = 67.321
n_s             = 0.9661
A_s             = 2.148752e-09
Tcmb            = 2.7255
k_p             = 0.05
N_ur            = 2.046
m_nu1           = 0.06
m_nu2           = 0.0
m_nu3           = 0.0
ZeroRadiation   = true      # GIZMO integrates matter + Lambda only, so back-scale without radiation
transfer        = CLASS
ztarget         = 0.0       # back-scale the z=0 transfer function to zstart

[random]
generator       = NGENIC
seed            = 12345

[execution]
NumThreads      = 8

[output]
format          = gadget_hdf5
filename        = scripts/test_problems/ics/cosmo_test32_ics.hdf5
